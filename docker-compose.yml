services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asistencia
      POSTGRES_PASSWORD: asistencia
      POSTGRES_DB: asistencia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistencia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://asistencia:asistencia@db:5432/asistencia
      NODE_ENV: development
      SESSION_SECRET: secreto_local_dev
    ports:
      - "3000:3000"

volumes:
  pgdata:
